services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: [mini, -dir=/data]
    environment:
      AWS_ACCESS_KEY_ID: methodconf-local
      AWS_SECRET_ACCESS_KEY: methodconf-local-password
      S3_BUCKET: methodconf-local
    ports:
      - '127.0.0.1:8334:8333'
    volumes:
      - 'seaweedfs-data:/data'
  backend:
    build:
      context: ./
      dockerfile: ./Dockerfile
    ports:
      - '${APP_PORT:-8080}:8080'
    env_file:
      - .env
    environment:
      AWS_ACCESS_KEY_ID: methodconf-local
      AWS_SECRET_ACCESS_KEY: methodconf-local-password
      AWS_SESSION_TOKEN: ""
      AWS__ServiceURL: http://seaweedfs:8333
      AWS__ForcePathStyle: "true"
      Umbraco__Storage__AWSS3__Media__BucketName: methodconf-local
    depends_on:
      - seaweedfs
    volumes:
      - './src/MethodConf.Cms/umbraco/Data/Umbraco.sqlite.db:/app/umbraco/Data/Umbraco.sqlite.db'
      - 'cache:/app/umbraco/Data/TEMP'
      - 'data-protection-keys:/home/app/.aspnet/DataProtection-Keys'
    restart: unless-stopped
    profiles: [ backend ]
  sqlite-web:
    build:
      context: https://github.com/coleifer/sqlite-web.git
      dockerfile: docker/Dockerfile
    ports:
      - "${SQLITE_WEB_PORT:-8080}:8080"
    volumes:
      - ./src/MethodConf.Cms/umbraco/Data:/data
    env_file:
      - .env
    command: >
      sqlite_web /data/Umbraco.sqlite.db
      --password "$SQLITE_WEB_PASSWORD"
      --host 0.0.0.0
    profiles: [ sqlite-web ]
  maildev:
    image: maildev/maildev
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${EMAIL_GUI_PORT:-1080}:1080'
    profiles: [ local-email ]

volumes:
  seaweedfs-data:
  cache:
  data-protection-keys:
